# 500 kyr run, slope q=3.5, 1 M_earth disk (same selected.csv as
# SS_800MP_500kyr_1Mearth_slopeq3.5), with semimajor axes drawn from a
# Lorentzian in ln a (peak ln mu = ln(mu_0**2 / sqrt(mu_0**2 + sigma**2)))
# truncated to [amin, amax]. a_sigma is the std of the old uniform belt,
# (amax - amin) / sqrt(12).
# compute.target: barbieri dispatches this to the shared lab machine over
# SSH (rsync + conda bootstrap + tmux). See README.md "Local vs. remote".

disk:
  a_distribution: lorentzian
  a_center: 100
  a_sigma: 2.887
  amax: 105
  amin: 95
  emax: 3.2e-05
  emin: 0.0
  imax_deg: 3.2e-05
  imin_deg: 0.0
giant_planet: null
integration:
  exit_max_distance: 1000.0
  integrator: mercurius
  maxtime: 500000
  time_step: 10000
  timestep_fraction_of_planet_period: 0.1
massive_planetesimals:
  N: 800
  distribution:
    type: power_law
    mode: csv
    variable: radius
    unit: km
    path: src/mass_models/cascade_selection_1000km_drop100_800keep_1Mearth/slope_q3.5/selected.csv
    slope: 3.5
notify:
  enabled: true
  ntfy_topic: https://ntfy.sh/elaine-hd216435-run
plots:
  dpi: 200
  enabled: true
  final_conditions:
    output_file: outputs/FinalConditions.png
  limits:
    a_evolution:
      xlim: null
      ylim: null
    ae:
      xlim: null
      ylim: null
    ai:
      xlim: null
      ylim: null
    e_evolution:
      xlim: null
      ylim: null
    i_evolution:
      xlim: null
      ylim: null
    mode: auto
    survival:
      xlim: null
      ylim: null
  scale:
    x: linear
    y: linear
simulation:
  dump: true
  name: SS_800MP_500kyr_1Mearth_slopeq3.5_lorentzian
  output_dir: outputs
  random_seed: 0
star:
  mass: 1.0
test_particles:
  N: 0
  distribution: uniform
units:
  length: AU
  mass: Msun
  time: yr
compute:
  target: barbieri
  tmux_session: null
  remotes:
    barbieri:
      host: 10.16.39.111
      username: elaine.nieves
      remote_dir: /hadoop_data/home/elaine.nieves/debris-disk-pipeline
      conda_env: debris_pipeline
      environment_file: environment.yml
      ssh_opts: []
      rsync_excludes: []
