simulation:
  name: "Condensed_sim_1Myr_1au_1earthmass_fine1yr"
  random_seed: 0
  output_dir: "outputs"
  dump: true

units:
  time: "yr"
  length: "AU"
  mass: "Msun"

integration:
  integrator: "mercurius"
  timestep_fraction_of_planet_period: 0.1
  maxtime: 1000000
  time_step: 1
  exit_max_distance: 1000.0

star:
  mass: 1.00

giant_planet: null

disk:
  amin: 0.95
  amax: 1.05
  emin: 0.0
  emax: 3.2e-5
  imin_deg: 0.0
  imax_deg: 3.2e-5

massive_planetesimals:
  N: 100
  total_disk_mass_earth: 0.28

test_particles:
  N: 0
  distribution: "uniform"

notify:
  enabled: true
  ntfy_topic: "https://ntfy.sh/elaine-hd216435-run"

plots:
  enabled: true
  dpi: 200

  scale:
    x: "linear"
    y: "linear"

  limits:
    mode: "auto"
    ae:
      xlim: null
      ylim: null

    ai:
      xlim: null
      ylim: null

    e_evolution:
      xlim: null
      ylim: null

    i_evolution:
      xlim: null
      ylim: null

    a_evolution:
      xlim: null
      ylim: null

    survival:
      xlim: null
      ylim: null

  final_conditions:
    output_file: "outputs/FinalConditions.png"
