# Remote-dispatch smoke test: same short 20,000 yr run as
# SmokeTest_800MP_slopeq3.yaml, but launched on the barbieri cluster
# via compute.target to validate rsync + conda bootstrap + tmux there
# before pointing the 7 full 100 Myr runs at it.

disk:
  amax: 105
  amin: 95
  emax: 3.2e-05
  emin: 0.0
  imax_deg: 3.2e-05
  imin_deg: 0.0
giant_planet: null
integration:
  exit_max_distance: 1000.0
  integrator: mercurius
  maxtime: 20000
  time_step: 2000
  timestep_fraction_of_planet_period: 0.1
massive_planetesimals:
  N: 800
  distribution:
    type: power_law
    mode: csv
    variable: radius
    unit: km
    path: src/mass_models/cascade_selection_200km_800keep/slope_q3/selected.csv
    slope: 3.0
notify:
  enabled: false
  ntfy_topic: https://ntfy.sh/elaine-hd216435-run
plots:
  dpi: 200
  enabled: true
  final_conditions:
    output_file: outputs/FinalConditions.png
  limits:
    a_evolution:
      xlim: null
      ylim: null
    ae:
      xlim: null
      ylim: null
    ai:
      xlim: null
      ylim: null
    e_evolution:
      xlim: null
      ylim: null
    i_evolution:
      xlim: null
      ylim: null
    mode: auto
    survival:
      xlim: null
      ylim: null
  scale:
    x: linear
    y: linear
simulation:
  dump: true
  name: SmokeTest_800MP_slopeq3_remote
  output_dir: outputs
  random_seed: 0
star:
  mass: 1.0
test_particles:
  N: 0
  distribution: uniform
units:
  length: AU
  mass: Msun
  time: yr
compute:
  target: barbieri
  tmux_session: null
  remotes:
    barbieri:
      host: 10.16.39.111
      username: elaine.nieves
      remote_dir: /hadoop_data/home/elaine.nieves/debris-disk-pipeline
      conda_env: debris_pipeline
      environment_file: environment.yml
      ssh_opts: []
      rsync_excludes: []
