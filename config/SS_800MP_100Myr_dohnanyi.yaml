simulation:
  name: "SS_800MP_100Myr_dohnanyi"
  random_seed: 0
  output_dir: "outputs"
  dump: true

units:
  time: "yr"
  length: "AU"
  mass: "Msun"

integration:
  integrator: "mercurius"
  timestep_fraction_of_planet_period: 0.1
  maxtime: 100000000
  time_step: 10000
  exit_max_distance: 1000.0

star:
  mass: 1.00

giant_planet: null

disk:
  amin: 95
  amax: 105
  emin: 0.0
  emax: 3.2e-5
  imin_deg: 0.0
  imax_deg: 3.2e-5

massive_planetesimals:
  N: 800
  # Total disk mass (as in the equal-mass sweeps); the distribution block
  # below splits it among the N planetesimals along a power law instead of
  # evenly. Remove the block to fall back to an even split.
  total_disk_mass_earth: 0.28
  distribution:
    type: power_law
    mode: total_mass       # rescale the sampled masses to sum to total_disk_mass_earth
    variable: radius
    min: 1
    max: 100
    unit: km
    slope: 3.5
    seed: 42

test_particles:
  N: 0
  distribution: "uniform"

notify:
  enabled: false
  ntfy_topic: "https://ntfy.sh/elaine-hd216435-run"

plots:
  enabled: true
  dpi: 200

  scale:
    x: "linear"
    y: "linear"

  limits:
    mode: "auto"
    ae:
      xlim: null
      ylim: null

    ai:
      xlim: null
      ylim: null

    e_evolution:
      xlim: null
      ylim: null

    i_evolution:
      xlim: null
      ylim: null

    a_evolution:
      xlim: null
      ylim: null

    survival:
      xlim: null
      ylim: null

  final_conditions:
    output_file: "outputs/FinalConditions.png"
