# Recreation of legacy debris-disk-pipeline-legacy:config/Kirvov_sim_100Myr.yaml (commit 98c873b):
# the 100 Myr IAS15 run at 1 AU (the 35 kyr run's setup carried to 100 Myr).
# The original .bin was lost with the old work computer.
#
# Converted to this pipeline's schema:
#   dwarf_planets.total_mass_earth -> massive_planetesimals.total_disk_mass_earth
#   integration.Noutputs (100)     -> integration.time_step = maxtime / 100
#   added simulation.dump, notify, plots.enabled
# The legacy pipeline drew initial conditions from unseeded np.random, so the
# exact particles can't be reproduced -- this is a statistical re-run of the
# same setup (now seeded, so it is reproducible from here on).

simulation:
  name: "Kirvov_sim_100Myr"
  random_seed: 0
  output_dir: "outputs"
  dump: true

units:
  time: "yr"
  length: "AU"
  mass: "Msun"

integration:
  integrator: "IAS15"                      # adaptive: dt below is only the initial step
  timestep_fraction_of_planet_period: 0.1
  maxtime: 100000000
  time_step: 1000000
  exit_max_distance: 1000.0

star:
  mass: 1.00

# The single big stirrer of the Ida & Makino / Krivov & Booth comparison.
giant_planet:
  mass_jupiter: 0.00011
  a: 1
  e: 3.2e-5
  inc_deg: 3.2e-5
  omega_deg: 100.0
  Omega_random: true

  t_peri_jd: 2450870.0
  orbital_period_days: 1311.0
  epoch_jd: 2451545.0

disk:
  amin: 0.945
  amax: 1.055
  emin: 0.0
  emax: 3.2e-5
  imin_deg: 0.0
  imax_deg: 3.2e-5

massive_planetesimals:
  N: 800
  total_disk_mass_earth: 0.28

test_particles:
  N: 0
  distribution: "uniform"

notify:
  enabled: true
  ntfy_topic: "https://ntfy.sh/elaine-hd216435-run"

plots:
  enabled: true
  dpi: 200

  scale:
    x: "linear"
    y: "linear"

  limits:
    mode: "auto"
    ae:
      xlim: null
      ylim: null

    ai:
      xlim: null
      ylim: null

    e_evolution:
      xlim: null
      ylim: null

    i_evolution:
      xlim: null
      ylim: null

    a_evolution:
      xlim: null
      ylim: null

    survival:
      xlim: null
      ylim: null

  final_conditions:
    output_file: "outputs/FinalConditions.png"
