# Single-node Slurm for the Linux Mint work computer (hostname "elaines",
# i7-10700: 8 cores / 16 threads, ~15.5 GB RAM; Slurm may hand out 14 GB of it). Copy to /etc/slurm/slurm.conf.
# One CPU (hardware thread) per job and 16 CPUs: REBOUND/Mercurius is
# single-threaded, so 9 runs fit at once, with a few pairs sharing a physical
# core. The NodeName line deliberately gives only CPUs=16 (no Sockets/Threads):
# with the topology listed, Slurm hands each job a whole core (two threads).
# For one run per physical core instead (extra runs queue), use CPUs=8.
ClusterName=workpc
SlurmctldHost=elaines

MpiDefault=none
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
ReturnToService=2
SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory

NodeName=elaines CPUs=16 RealMemory=14000 State=UNKNOWN
PartitionName=main Nodes=elaines Default=YES MaxTime=INFINITE State=UP
